name: OmniView CI (Linux)

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux (Ubuntu x86_64)
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qtbase5-dev \
            libqt5sql5-sqlite \
            qt5-image-formats-plugins \
            qttools5-dev-tools

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build OmniView
        run: cmake --build build --parallel

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Prepare Package
        run: |
          mkdir -p dist
          cp build/omniview-cpp dist/omniview
          chmod +x dist/omniview

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniview-linux-x86_64
          path: dist/
          if-no-files-found: error

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer_name }}, Qt ${{ matrix.qt }})
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
        sanitizer: ['address;undefined', 'thread']
        include:
          - sanitizer: 'address;undefined'
            sanitizer_name: ASan+UBSan
          - sanitizer: 'thread'
            sanitizer_name: TSan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.qt }}" = "5" ]; then
            sudo apt-get install -y build-essential cmake ninja-build \
              qtbase5-dev libqt5sql5-sqlite qt5-image-formats-plugins
          else
            sudo apt-get install -y build-essential cmake ninja-build \
              qt6-base-dev libqt6sql6-sqlite qt6-image-formats-plugins libgl-dev
          fi

      # TSan's shadow memory layout does not support the 32-bit mmap
      # randomisation newer runner kernels use.
      - name: Reduce ASLR entropy for TSan
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt${{ matrix.qt }} \
            -DOMNIVIEW_WARNINGS=ON \
            "-DOMNIVIEW_SANITIZE=${{ matrix.sanitizer }}"

      - name: Build
        run: cmake --build build --parallel

      # Suppression files (tools/sanitizers/) only cover uninstrumented Qt
      # libraries; any report in OmniView code fails the job.
      - name: Test
        run: ctest --test-dir build --output-on-failure
