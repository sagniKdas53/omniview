name: OmniView Multi-Platform CI

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu x86_64)
            os: ubuntu-22.04
            platform: linux
            artifact_name: omniview-linux-x86_64

          - name: macOS (Apple Silicon / Intel)
            os: macos-latest
            platform: macos
            artifact_name: omniview-macos

          - name: Windows (x64 MSVC)
            os: windows-2022
            platform: windows
            artifact_name: omniview-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Linux dependencies ---
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qtbase5-dev \
            libqt5sql5-sqlite \
            qt5-image-formats-plugins \
            qttools5-dev-tools

      # --- macOS dependencies ---
      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install cmake ninja qt

      # --- Windows Qt setup ---
      - name: Install Windows Qt
        if: matrix.platform == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          # WebP support for the shared thumbnail cache format.
          modules: 'qtimageformats'

      # --- Configure CMake ---
      - name: Configure CMake (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Ninja"

      - name: Configure CMake (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -G "Ninja"

      - name: Configure CMake (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      # --- Build ---
      - name: Build OmniView (Unix)
        if: matrix.platform != 'windows'
        run: |
          cmake --build build --parallel

      - name: Build OmniView (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake --build build --config Release --parallel

      # Deploy the runtime next to test executables before CTest launches them.
      - name: Deploy Windows test runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          windeployqt --release --no-translations build\Release\omniview_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($t in @('database_regression_tests', 'imaging_tests', 'zip_scanner_tests', 'thumbnail_tests', 'ui_tests')) {
            windeployqt --release --no-translations "build\Release\$t.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # --- Run Tests ---
      - name: Run Tests (Linux)
        if: matrix.platform == 'linux'
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Tests (macOS)
        if: matrix.platform == 'macos'
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Tests (Windows)
        if: matrix.platform == 'windows'
        run: |
          ctest --test-dir build -C Release --output-on-failure --verbose
          $testExit = $LASTEXITCODE
          $results = Get-ChildItem build -Filter '*-results.txt' -ErrorAction SilentlyContinue
          foreach ($r in $results) {
            Write-Output "===== $($r.Name) ====="
            Get-Content $r.FullName
          }
          exit $testExit

      # --- Package Artifacts ---
      - name: Prepare Linux Package
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          cp build/omniview-cpp dist/omniview
          chmod +x dist/omniview

      - name: Prepare macOS Package
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          cp build/omniview-cpp dist/omniview-macos
          chmod +x dist/omniview-macos

      - name: Prepare Windows Package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Release\omniview-cpp.exe -Destination dist\omniview.exe
          windeployqt --release --no-translations --no-opengl-sw dist\omniview.exe

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: error

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer_name }}, Qt ${{ matrix.qt }})
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
        sanitizer: ['address;undefined', 'thread']
        include:
          - sanitizer: 'address;undefined'
            sanitizer_name: ASan+UBSan
          - sanitizer: 'thread'
            sanitizer_name: TSan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.qt }}" = "5" ]; then
            sudo apt-get install -y build-essential cmake ninja-build \
              qtbase5-dev libqt5sql5-sqlite qt5-image-formats-plugins
          else
            sudo apt-get install -y build-essential cmake ninja-build \
              qt6-base-dev libqt6sql6-sqlite qt6-image-formats-plugins libgl-dev
          fi

      # TSan's shadow memory layout does not support the 32-bit mmap
      # randomisation newer runner kernels use.
      - name: Reduce ASLR entropy for TSan
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt${{ matrix.qt }} \
            -DOMNIVIEW_WARNINGS=ON \
            "-DOMNIVIEW_SANITIZE=${{ matrix.sanitizer }}"

      - name: Build
        run: cmake --build build --parallel

      # Suppression files (tools/sanitizers/) only cover uninstrumented Qt
      # libraries; any report in OmniView code fails the job.
      - name: Test
        run: ctest --test-dir build --output-on-failure
